<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Opini - SINAR BEMO</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="description" content="Kolom opini dan analisis dari para penulis SINAR BEMO.">
<link rel="canonical" href="https://sinarbemo.com/opini">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div id="site-header-mount"></div>
<div id="site-navbar-mount"></div>
<div id="breaking-news-mount"></div>
<script>Components.mountPublicLayout('opini');</script>

<main x-data="opiniApp()" x-init="init()">
  <div class="container-app py-6">
    <div class="section-head"><h1 class="text-h1">Opini</h1></div>

    <template x-if="loading">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <template x-for="i in 4"><div class="skeleton" style="height:120px;"></div></template>
      </div>
    </template>

    <template x-if="!loading">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <template x-for="o in opinions" :key="o.id">
          <article class="card p-5 flex gap-4">
            <img :src="o.avatar" :alt="o.author" class="w-14 h-14 rounded-full object-cover flex-shrink-0">
            <div class="min-w-0">
              <span class="badge" style="background:var(--secondary-light);color:var(--secondary-dark);">Opini</span>
              <h3 class="card-title mt-2" x-text="o.title"></h3>
              <p class="card-excerpt line-clamp-2 mt-1" x-text="o.excerpt"></p>
              <div class="card-meta mt-2"><span x-text="o.author"></span><span>&middot;</span><span x-text="Components.timeAgo(o.date)"></span></div>
            </div>
          </article>
        </template>
      </div>
    </template>
  </div>
</main>

<div id="site-footer-mount"></div>
<script>(function(){ var m=document.getElementById('site-footer-mount'); if(m) m.outerHTML = Components.footerHTML(); })();</script>
<script>
  window.addEventListener('DOMContentLoaded', () => setTimeout(() => window.lucide && lucide.createIcons(), 150));
</script>
</body>
</html>
