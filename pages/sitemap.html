<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sitemap - SINAR BEMO</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="description" content="Peta situs SINAR BEMO.">
<link rel="canonical" href="https://sinarbemo.com/sitemap">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div id="site-header-mount"></div>
<div id="site-navbar-mount"></div>
<div id="breaking-news-mount"></div>
<script>Components.mountPublicLayout('');</script>

<main x-data="{ categories: window.SINARBEMO_DATA.categories }">
  <div class="container-app py-10">
    <h1 class="text-h1 mb-6">Sitemap</h1>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-8">
      <div>
        <h2 class="text-h3 mb-3">Halaman Utama</h2>
        <ul class="flex flex-col gap-2 text-sm" style="color:var(--secondary);">
          <li><a href="../index.html">Beranda</a></li>
          <li><a href="terbaru.html">Berita Terbaru</a></li>
          <li><a href="populer.html">Berita Terpopuler</a></li>
          <li><a href="search.html">Pencarian</a></li>
          <li><a href="foto.html">Foto</a></li>
          <li><a href="video.html">Video</a></li>
          <li><a href="opini.html">Opini</a></li>
        </ul>
      </div>
      <div>
        <h2 class="text-h3 mb-3">Kategori</h2>
        <ul class="flex flex-col gap-2 text-sm" style="color:var(--secondary);">
          <template x-for="c in categories" :key="c.id">
            <li><a :href="'kategori.html?slug=' + c.slug" x-text="c.name"></a></li>
          </template>
        </ul>
      </div>
      <div>
        <h2 class="text-h3 mb-3">Perusahaan &amp; Legal</h2>
        <ul class="flex flex-col gap-2 text-sm" style="color:var(--secondary);">
          <li><a href="tentang.html">Tentang Kami</a></li>
          <li><a href="kontak.html">Kontak</a></li>
          <li><a href="privacy.html">Privacy Policy</a></li>
          <li><a href="disclaimer.html">Disclaimer</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </div>
</main>

<div id="site-footer-mount"></div>
<script>(function(){ var m=document.getElementById('site-footer-mount'); if(m) m.outerHTML = Components.footerHTML(); })();</script>
<script>window.addEventListener('DOMContentLoaded', () => setTimeout(() => window.lucide && lucide.createIcons(), 150));</script>
</body>
</html>
