<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Galeri Foto - SINAR BEMO.COM</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="description" content="Kumpulan foto jurnalistik dan dokumentasi peristiwa dari SINAR BEMO.COM.">
<link rel="canonical" href="https://sinarbemo.com/foto">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div id="site-header-mount"></div>
<div id="site-navbar-mount"></div>
<div id="breaking-news-mount"></div>
<script>Components.mountPublicLayout('foto');</script>

<main x-data="galleryApp()" x-init="init()">
  <div class="container-app py-6">
    <div class="section-head"><h1 class="text-h1">Galeri Foto</h1></div>

    <template x-if="loading">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <template x-for="i in 8"><div class="skeleton" style="aspect-ratio:1/1;"></div></template>
      </div>
    </template>

    <template x-if="!loading">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <template x-for="(p, i) in photos" :key="p.id">
          <button @click="open(i)" class="rounded-md overflow-hidden aspect-square relative group text-left" :aria-label="'Buka foto ' + p.title">
            <img :src="p.image" :alt="p.title" class="w-full h-full object-cover" style="transition:transform .3s;" loading="lazy">
            <div class="absolute inset-0 flex items-end p-2" style="background:linear-gradient(to top, rgba(0,0,0,.6), transparent 50%);">
              <span class="text-white text-xs line-clamp-1" x-text="p.title"></span>
            </div>
          </button>
        </template>
      </div>
    </template>

    <!-- Lightbox -->
    <div x-show="lightboxOpen" x-cloak x-transition class="modal-overlay fixed inset-0 flex items-center justify-center p-4" @keydown.escape.window="close()">
      <button @click="close()" class="absolute top-4 right-4 text-white p-2" aria-label="Tutup"><i data-lucide="x" style="width:26px;height:26px"></i></button>
      <button @click="prev()" class="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 text-white p-2" aria-label="Sebelumnya"><i data-lucide="chevron-left" style="width:32px;height:32px"></i></button>
      <button @click="next()" class="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 text-white p-2" aria-label="Berikutnya"><i data-lucide="chevron-right" style="width:32px;height:32px"></i></button>
      <template x-if="active">
        <div class="max-w-3xl w-full">
          <img :src="active.image" :alt="active.title" class="w-full rounded-lg" style="max-height:70vh;object-fit:contain;background:#000;">
          <div class="text-white mt-3">
            <h3 class="font-semibold" x-text="active.title"></h3>
            <p class="text-sm opacity-70" x-text="active.caption + ' — ' + active.author"></p>
          </div>
        </div>
      </template>
    </div>
  </div>
</main>

<div id="site-footer-mount"></div>
<script>(function(){ var m=document.getElementById('site-footer-mount'); if(m) m.outerHTML = Components.footerHTML(); })();</script>
<script>
  window.addEventListener('DOMContentLoaded', () => setTimeout(() => window.lucide && lucide.createIcons(), 150));
  document.addEventListener('alpine:initialized', () => window.lucide && lucide.createIcons());
</script>
</body>
</html>
