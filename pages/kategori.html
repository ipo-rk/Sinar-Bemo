<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kategori Berita - SINAR BEMO</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="description" content="Jelajahi berita berdasarkan kategori di SINAR BEMO.">
<link rel="canonical" href="https://sinarbemo.com/kategori">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div id="site-header-mount"></div>
<div id="site-navbar-mount"></div>
<div id="breaking-news-mount"></div>
<script>
  const _params = new URLSearchParams(location.search);
  Components.mountPublicLayout(_params.get('slug') || 'nasional');
</script>

<main x-data="categoryApp()" x-init="init()">
  <div class="container-app py-6">

    <nav aria-label="breadcrumb" class="text-sm mb-4" style="color:var(--gray-500);">
      <a href="../index.html">Beranda</a> / <span style="color:var(--dark);" x-text="category ? category.name : ''"></span>
    </nav>

    <template x-if="loading">
      <div class="skeleton" style="height:80px;"></div>
    </template>

    <template x-if="!loading">
      <div>
        <div class="flex items-center gap-4 mb-8 pb-6" style="border-bottom:2px solid var(--dark);">
          <span class="cat-icon" style="width:56px;height:56px;"><i data-lucide="newspaper" style="width:24px;height:24px;"></i></span>
          <div>
            <h1 class="text-h1" x-text="category.name"></h1>
            <p class="text-sm" style="color:var(--gray-500);" x-text="category.description"></p>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="lg:col-span-2">
            <div class="flex items-center justify-between mb-5">
              <span class="text-sm" style="color:var(--gray-500);" x-text="articles.length + ' berita ditemukan'"></span>
              <select x-model="sortBy" class="form-control" style="width:auto;">
                <option value="latest">Terbaru</option>
                <option value="popular">Terpopuler</option>
              </select>
            </div>

            <template x-if="articles.length === 0">
              <div x-html="Components.emptyStateHTML('Belum ada berita di kategori ini.', 'Silakan cek kembali nanti atau lihat kategori lain.')"></div>
            </template>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <template x-for="a in paged" :key="a.id">
                <div x-html="Components.newsCardHTML(a)"></div>
              </template>
            </div>

            <div class="flex flex-wrap justify-center gap-2 mt-8" x-show="totalPages > 1">
              <button @click="currentPage = Math.max(1, currentPage - 1)" class="page-btn"><i data-lucide="chevron-left" style="width:14px;height:14px"></i></button>
              <template x-for="p in totalPages" :key="p">
                <button @click="currentPage = p" class="page-btn" :class="currentPage === p ? 'active' : ''" x-text="p"></button>
              </template>
              <button @click="currentPage = Math.min(totalPages, currentPage + 1)" class="page-btn"><i data-lucide="chevron-right" style="width:14px;height:14px"></i></button>
            </div>
          </div>

          <aside class="flex flex-col gap-8">
            <div>
              <div class="section-head"><h2 class="text-h2">Kategori Lain</h2></div>
              <div class="grid grid-cols-2 gap-3">
                <template x-for="c in categories" :key="c.id">
                  <div x-html="Components.categoryCardHTML(c)"></div>
                </template>
              </div>
            </div>
            <div x-html="Components.adSlotHTML('ADVERTISEMENT', 'py-16')"></div>
          </aside>
        </div>
      </div>
    </template>
  </div>
</main>

<div id="site-footer-mount"></div>
<script>(function(){ var m=document.getElementById('site-footer-mount'); if(m) m.outerHTML = Components.footerHTML(); })();</script>
<script>
  window.addEventListener('DOMContentLoaded', () => setTimeout(() => window.lucide && lucide.createIcons(), 150));
  document.addEventListener('alpine:initialized', () => window.lucide && lucide.createIcons());
</script>
</body>
</html>
