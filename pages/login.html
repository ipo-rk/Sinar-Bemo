<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login - SINAR BEMO.COM</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
  <link rel="shortcut icon" href="../favicon.ico">
  <meta name="description" content="Login demo SINAR BEMO.COM (simulasi UI, tanpa backend).">
  <link rel="canonical" href="https://sinarbemo.com/login">

  <script>(function () { const w = console.warn; console.warn = function (...a) { if (typeof a[0] === "string" && a[0].includes("cdn.tailwindcss.com")) return; w.apply(console, a); }; })();</script>
  <script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>window.ASSET_BASE = '../';</script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body style="background:var(--bg-body);">

  <div class="container-app py-10">
    <a href="../index.html" class="flex flex-col items-center leading-none mb-8 group">
      <img src="../assets/img/logo.png" alt="Logo Sinar Bemo"
        class="w-16 h-16 object-contain mb-3 transition-transform group-hover:scale-105">
      <span class="brand-logo">SINAR <span>BEMO</span>.COM</span>
      <span class="brand-tagline">BERITA AKURAT &amp; TERKINI</span>
    </a>

    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8" x-data="loginApp()">
      <div class="card p-6">
        <h1 class="text-h2 mb-1">Masuk ke Akun</h1>
        <p class="text-sm mb-5" style="color:var(--gray-500);">Simulasi login untuk keperluan prototype frontend (tanpa
          backend).</p>
        <form @submit.prevent="login()" class="flex flex-col gap-4">
          <div>
            <label class="form-label">Email</label>
            <input x-model="email" type="email" class="form-control" placeholder="nama@sinarbemo.com" required>
          </div>
          <div>
            <label class="form-label">Kata Sandi</label>
            <input x-model="password" type="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p class="text-xs mt-4 text-center" style="color:var(--gray-500);">Belum punya akun? <a href="#"
            style="color:var(--secondary);font-weight:600;">Daftar sebagai Pembaca</a></p>
      </div>

      <div>
        <h2 class="text-h3 mb-3">Akun Demo</h2>
        <p class="text-sm mb-3" style="color:var(--gray-500);">Klik salah satu akun untuk mengisi form secara otomatis
          (password: <code>demo123</code>).</p>
        <div class="flex flex-col gap-2">
          <template x-for="acc in accounts" :key="acc.email">
            <button @click="quickFill(acc)" class="card p-3 flex items-center gap-3 text-left hover:opacity-80">
              <img :src="acc.avatar" class="w-9 h-9 rounded-full object-cover" alt="">
              <div class="min-w-0">
                <div class="font-semibold text-sm" x-text="acc.role"></div>
                <div class="text-meta" x-text="acc.email"></div>
              </div>
            </button>
          </template>
        </div>
      </div>
    </div>
  </div>

  <script>window.addEventListener('DOMContentLoaded', () => setTimeout(() => window.lucide && lucide.createIcons(), 150));</script>
</body>

</html>
