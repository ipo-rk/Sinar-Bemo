<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Video - SINAR BEMO.COM</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="description" content="Liputan video terbaru dari SINAR BEMO.COM.">
<link rel="canonical" href="https://sinarbemo.com/video">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div id="site-header-mount"></div>
<div id="site-navbar-mount"></div>
<div id="breaking-news-mount"></div>
<script>Components.mountPublicLayout('video');</script>

<main x-data="videoApp()" x-init="init()">
  <div class="container-app py-6">
    <div class="section-head"><h1 class="text-h1">Video</h1></div>

    <template x-if="loading">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="i in 6"><div class="skeleton" style="aspect-ratio:16/9;"></div></template>
      </div>
    </template>

    <template x-if="!loading">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="v in videos" :key="v.id">
          <button @click="play(v)" class="card overflow-hidden text-left">
            <div class="relative aspect-video">
              <img :src="v.thumbnail" :alt="v.title" class="w-full h-full object-cover" loading="lazy">
              <div class="absolute inset-0 flex items-center justify-center" style="background:rgba(0,0,0,.25);">
                <div class="rounded-full flex items-center justify-center" style="width:52px;height:52px;background:rgba(255,255,255,.92);">
                  <i data-lucide="play" style="width:22px;height:22px;color:var(--dark);margin-left:2px;"></i>
                </div>
              </div>
            </div>
            <div class="p-3">
              <h3 class="card-title line-clamp-2" style="font-size:14px;" x-text="v.title"></h3>
              <span class="text-meta" x-text="Components.formatViews(v.views) + 'x ditonton &middot; ' + Components.timeAgo(v.date)"></span>
            </div>
          </button>
        </template>
      </div>
    </template>

    <!-- Video Modal -->
    <div x-show="modalOpen" x-cloak x-transition class="modal-overlay fixed inset-0 flex items-center justify-center p-4" @keydown.escape.window="close()">
      <div class="max-w-3xl w-full" @click.outside="close()">
        <div class="flex justify-end mb-2">
          <button @click="close()" class="text-white" aria-label="Tutup"><i data-lucide="x" style="width:26px;height:26px"></i></button>
        </div>
        <template x-if="activeVideo">
          <div>
            <video :src="activeVideo.url" controls autoplay class="w-full rounded-lg" style="max-height:70vh;background:#000;"></video>
            <h3 class="text-white font-semibold mt-3" x-text="activeVideo.title"></h3>
            <p class="text-white text-sm opacity-70 mt-1" x-text="activeVideo.description"></p>
          </div>
        </template>
      </div>
    </div>
  </div>
</main>

<div id="site-footer-mount"></div>
<script>(function(){ var m=document.getElementById('site-footer-mount'); if(m) m.outerHTML = Components.footerHTML(); })();</script>
<script>
  window.addEventListener('DOMContentLoaded', () => setTimeout(() => window.lucide && lucide.createIcons(), 150));
  document.addEventListener('alpine:initialized', () => window.lucide && lucide.createIcons());
</script>
</body>
</html>
