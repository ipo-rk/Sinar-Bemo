<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Berita - SINAR BEMO.COM</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
  <link rel="shortcut icon" href="../favicon.ico">
  <meta name="description" content="Baca berita selengkapnya hanya di SINAR BEMO.COM — Berita Akurat & Terkini.">
  <link rel="canonical" href="https://sinarbemo.com/berita/judul-berita">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary_large_image">

  <script>(function () { const w = console.warn; console.warn = function (...a) { if (typeof a[0] === "string" && a[0].includes("cdn.tailwindcss.com")) return; w.apply(console, a); }; })();</script>
  <script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>window.ASSET_BASE = '../';</script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body>

  <div id="site-header-mount"></div>
  <div id="site-navbar-mount"></div>
  <div id="breaking-news-mount"></div>
  <script>Components.mountPublicLayout('nasional');</script>

  <main x-data="articleApp()" x-init="init()">
    <div class="container-app py-6">

      <template x-if="loading">
        <div class="max-w-3xl mx-auto flex flex-col gap-3">
          <div class="skeleton" style="height:14px;width:30%;"></div>
          <div class="skeleton" style="height:36px;width:90%;"></div>
          <div class="skeleton" style="aspect-ratio:16/9;"></div>
          <div class="skeleton" style="height:14px;width:100%;"></div>
          <div class="skeleton" style="height:14px;width:100%;"></div>
          <div class="skeleton" style="height:14px;width:70%;"></div>
        </div>
      </template>

      <template x-if="!loading">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <!-- MAIN ARTICLE -->
          <article class="lg:col-span-2 min-w-0">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="text-sm mb-4" style="color:var(--gray-500);">
              <a href="../index.html">Beranda</a> /
              <a :href="'kategori.html?slug=' + article.category_slug" x-text="article.category"></a> /
              <span style="color:var(--dark);">Detail</span>
            </nav>

            <span class="badge badge-category" x-text="article.category"></span>
            <h1 class="text-h1 mt-3 mb-3" x-text="article.title"></h1>
            <p class="text-lg" style="color:var(--gray-500);" x-text="article.excerpt"></p>

            <div class="flex flex-wrap items-center gap-4 mt-4 pb-5"
              style="border-bottom:1px solid var(--border-color);">
              <div class="flex items-center gap-2">
                <img src="https://i.pravatar.cc/80" class="w-9 h-9 rounded-full object-cover" alt="avatar penulis">
                <div class="text-sm">
                  <div class="font-semibold" x-text="article.author"></div>
                  <div class="text-meta" x-text="Components.formatDate(article.published_at)"></div>
                </div>
              </div>
              <div class="flex items-center gap-1 text-meta ml-auto">
                <i data-lucide="eye" style="width:14px;height:14px"></i>
                <span x-text="Components.formatViews(article.views) + 'x dibaca'"></span>
              </div>
            </div>

            <figure class="my-6">
              <img :src="article.image" :alt="article.title" class="w-full rounded-lg"
                style="aspect-ratio:16/9;object-fit:cover;" loading="lazy">
              <figcaption class="text-meta mt-2 italic" x-text="article.caption"></figcaption>
            </figure>

            <div x-html="Components.adSlotHTML('ADVERTISEMENT', 'py-6 mb-6')"></div>

            <div class="article-body">
              <template x-for="(p, i) in article.content" :key="i">
                <p x-text="p"></p>
              </template>
            </div>

            <div class="flex flex-wrap gap-2 mt-6">
              <template x-for="t in article.tags" :key="t">
                <span class="badge" style="background:var(--gray-100);color:var(--gray-700);" x-text="'#' + t"></span>
              </template>
            </div>

            <!-- Share & Bookmark -->
            <div class="flex flex-wrap items-center gap-2 mt-6 py-5"
              style="border-top:1px solid var(--border-color);border-bottom:1px solid var(--border-color);">
              <span class="text-sm font-semibold mr-2">Bagikan:</span>
              <button @click="shareWhatsapp()" class="btn btn-outline btn-sm inline-flex items-center gap-1.5"
                aria-label="Bagikan ke WhatsApp"><span class="inline-flex"
                  x-html="Components.socialIcon('whatsapp', 14)"></span> WhatsApp</button>
              <button @click="shareFacebook()" class="btn btn-outline btn-sm inline-flex items-center gap-1.5"
                aria-label="Bagikan ke Facebook"><span class="inline-flex"
                  x-html="Components.socialIcon('facebook', 14)"></span> Facebook</button>
              <button @click="shareTwitter()" class="btn btn-outline btn-sm inline-flex items-center gap-1.5"
                aria-label="Bagikan ke X"><span class="inline-flex"
                  x-html="Components.socialIcon('twitter', 14)"></span> X</button>
              <button @click="copyLink()" class="btn btn-outline btn-sm" aria-label="Salin link"><i data-lucide="link"
                  style="width:14px;height:14px"></i> Salin Link</button>
              <button @click="toggleBookmark()" class="btn btn-sm ml-auto"
                :class="bookmarked ? 'btn-primary' : 'btn-outline'">
                <i data-lucide="bookmark" style="width:14px;height:14px"></i>
                <span x-text="bookmarked ? 'Tersimpan' : 'Simpan'"></span>
              </button>
            </div>

            <div x-html="Components.adSlotHTML('ADVERTISEMENT', 'py-6 my-6')"></div>

            <!-- Related -->
            <div class="mt-8">
              <div class="section-head">
                <h2 class="text-h2">Berita Terkait</h2>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <template x-for="a in related" :key="a.id">
                  <div x-html="Components.newsCardHTML(a)"></div>
                </template>
              </div>
            </div>

            <!-- Comments -->
            <div class="mt-10" id="komentar">
              <div class="section-head">
                <h2 class="text-h2" x-text="'Komentar (' + comments.length + ')'"></h2>
              </div>

              <form @submit.prevent="submitComment()" class="card p-5 mb-6 flex flex-col gap-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="form-label">Nama</label>
                    <input x-model="commentForm.name" type="text" class="form-control" placeholder="Nama Anda" required>
                  </div>
                  <div>
                    <label class="form-label">Email</label>
                    <input x-model="commentForm.email" type="email" class="form-control" placeholder="email@contoh.com"
                      required>
                  </div>
                </div>
                <div>
                  <label class="form-label">Komentar</label>
                  <textarea x-model="commentForm.content" rows="3" class="form-control"
                    placeholder="Tulis komentar Anda..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary self-start">Kirim Komentar</button>
              </form>

              <div class="flex flex-col gap-5">
                <template x-for="c in comments" :key="c.id">
                  <div class="flex gap-3">
                    <img src="https://i.pravatar.cc/80?u=1" class="w-10 h-10 rounded-full flex-shrink-0" alt="avatar">
                    <div class="flex-1 min-w-0">
                      <div class="card p-4">
                        <div class="flex items-center justify-between">
                          <span class="font-semibold text-sm" x-text="c.name"></span>
                          <span class="text-meta" x-text="Components.timeAgo(c.date)"></span>
                        </div>
                        <p class="text-sm mt-1" x-text="c.content"></p>
                      </div>
                      <div class="flex items-center gap-4 mt-2 ml-1 text-meta">
                        <button @click="likeComment(c)" class="flex items-center gap-1 hover:opacity-70"><i
                            data-lucide="thumbs-up" style="width:13px;height:13px"></i> <span
                            x-text="c.likes"></span></button>
                        <button class="hover:opacity-70">Balas</button>
                        <button class="hover:opacity-70">Laporkan</button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </article>

          <!-- SIDEBAR -->
          <aside class="flex flex-col gap-8">
            <div>
              <div class="section-head">
                <h2 class="text-h2">Terpopuler</h2>
              </div>
              <div class="card p-4">
                <template x-for="(a, i) in popular" :key="a.id">
                  <div x-html="Components.popularItemHTML(a, i + 1)"></div>
                </template>
              </div>
            </div>
            <div x-html="Components.adSlotHTML('ADVERTISEMENT', 'py-16')"></div>
          </aside>
        </div>
      </template>
    </div>
  </main>

  <div id="site-footer-mount"></div>
  <script>
    (function () { var m = document.getElementById('site-footer-mount'); if (m) m.outerHTML = Components.footerHTML(); })();
  </script>
  <script>
    window.addEventListener('DOMContentLoaded', () => setTimeout(() => window.lucide && lucide.createIcons(), 150));
    document.addEventListener('alpine:initialized', () => window.lucide && lucide.createIcons());
  </script>
</body>

</html>
