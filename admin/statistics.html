<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistics - Admin SINAR BEMO.COM</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="robots" content="noindex, nofollow">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div class="admin-shell" x-data="adminShell('statistics')">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-content">
    <div id="admin-topbar-mount"></div>

    <div class="admin-main" x-data="{ s: window.SINARBEMO_DATA.statistics, init(){ this.$nextTick(() => this.renderAll()); },
      renderAll(){
        new Chart(document.getElementById('cMonthly'), { type:'line', data:{ labels:this.s.monthly_labels, datasets:[{label:'Views Bulanan', data:this.s.monthly_views, borderColor:'#ef4444', backgroundColor:'rgba(239,68,68,.1)', fill:true, tension:.4}]}, options:{maintainAspectRatio:false, plugins:{legend:{display:false}}} });
        new Chart(document.getElementById('cWeekly'), { type:'bar', data:{ labels:this.s.weekly_labels, datasets:[{label:'Views Mingguan', data:this.s.weekly_views, backgroundColor:'#2563eb', borderRadius:6}]}, options:{maintainAspectRatio:false, plugins:{legend:{display:false}}} });
        new Chart(document.getElementById('cDaily'), { type:'line', data:{ labels:this.s.daily_labels, datasets:[{label:'Views Harian', data:this.s.daily_views, borderColor:'#16a34a', backgroundColor:'rgba(22,163,74,.1)', fill:true, tension:.4}]}, options:{maintainAspectRatio:false, plugins:{legend:{display:false}}} });
        new Chart(document.getElementById('cCategory'), { type:'pie', data:{ labels:this.s.category_stats.map(c=>c.name), datasets:[{data:this.s.category_stats.map(c=>c.value), backgroundColor:['#ef4444','#2563eb','#facc15','#16a34a','#7c3aed','#0891b2']}]}, options:{maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11}}}}} });
      } }" x-init="init()">

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
        <div class="card p-4"><h3 class="text-h3 mb-3">Views Bulanan</h3><div style="height:240px;"><canvas id="cMonthly"></canvas></div></div>
        <div class="card p-4"><h3 class="text-h3 mb-3">Views Mingguan</h3><div style="height:240px;"><canvas id="cWeekly"></canvas></div></div>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="card p-4"><h3 class="text-h3 mb-3">Views Harian</h3><div style="height:240px;"><canvas id="cDaily"></canvas></div></div>
        <div class="card p-4"><h3 class="text-h3 mb-3">Statistik Kategori</h3><div style="height:240px;"><canvas id="cCategory"></canvas></div></div>
      </div>
    </div>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    mountAdminShell('statistics', 'Statistics');
    setTimeout(() => window.lucide && lucide.createIcons(), 200);
  });
</script>
</body>
</html>
