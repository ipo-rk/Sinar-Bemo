<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penulis - Admin SINAR BEMO</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
  <link rel="shortcut icon" href="../favicon.ico">
  <meta name="robots" content="noindex, nofollow">

  <script>(function () { const w = console.warn; console.warn = function (...a) { if (typeof a[0] === "string" && a[0].includes("cdn.tailwindcss.com")) return; w.apply(console, a); }; })();</script>
  <script>/* theme-init */!function () { var t = localStorage.getItem('theme') || 'system', d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light') }()</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>window.ASSET_BASE = '../';</script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body>

  <div class="admin-shell" x-data="adminShell('penulis')">
    <div id="admin-sidebar-mount"></div>
    <div class="admin-content">
      <div id="admin-topbar-mount"></div>

      <div class="admin-main" x-data="authorsApp()" x-init="init()">
        <div class="flex justify-between items-center mb-5">
          <p class="text-sm" style="color:var(--gray-500);" x-text="authors.length + ' penulis terdaftar'"></p>
          <button @click="openAdd()" class="btn btn-primary btn-sm"><i data-lucide="plus"
              style="width:14px;height:14px"></i> Tambah Penulis</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <template x-for="a in authors" :key="a.id">
            <div class="card p-5">
              <div class="flex items-center gap-3">
                <img :src="a.avatar" class="w-14 h-14 rounded-full object-cover" :alt="a.name">
                <div>
                  <div class="font-semibold" x-text="a.name"></div>
                  <div class="text-meta" x-text="a.role"></div>
                </div>
              </div>
              <p class="text-sm mt-3" style="color:var(--gray-500);" x-text="a.bio"></p>
              <div class="flex items-center justify-between mt-4 pt-3"
                style="border-top:1px solid var(--border-color);">
                <span class="text-meta" x-text="articleCount(a.name) + ' artikel'"></span>
                <div class="flex gap-1">
                  <button @click="openEdit(a)" class="action-icon-btn" aria-label="Edit"><i data-lucide="pencil"
                      style="width:15px;height:15px"></i></button>
                  <button @click="remove(a)" class="action-icon-btn danger" aria-label="Hapus"><i data-lucide="trash-2"
                      style="width:15px;height:15px"></i></button>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- Modal Tambah / Edit Penulis -->
        <div x-show="showModal" x-cloak x-transition
          class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4"
          @keydown.escape.window="showModal=false">
          <div class="modal-panel max-w-md w-full p-6" @click.outside="showModal=false">
            <h3 class="text-h3 mb-4" x-text="editing ? 'Edit Data Penulis' : 'Tambah Penulis Baru'"></h3>
            <label class="form-label">Nama Lengkap</label>
            <input x-model="form.name" type="text" class="form-control mb-3" placeholder="Contoh: Maria Kaize">
            <label class="form-label">Jabatan / Role</label>
            <input x-model="form.role" type="text" class="form-control mb-3" placeholder="Contoh: Wartawan Politik">
            <label class="form-label">Biografi Singkat</label>
            <textarea x-model="form.bio" rows="2" class="form-control mb-3" placeholder="Fokus liputan..."></textarea>
            <label class="form-label">URL Foto Avatar</label>
            <input x-model="form.avatar" type="text" class="form-control mb-4" placeholder="https://...">
            <div class="flex gap-2 justify-end">
              <button @click="showModal=false" class="btn btn-outline">Batal</button>
              <button @click="save()" class="btn btn-primary">Simpan</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      mountAdminShell('penulis', 'Penulis');
      setTimeout(() => window.lucide && lucide.createIcons(), 200);
    });
    document.addEventListener('alpine:initialized', () => window.lucide && lucide.createIcons());
  </script>
</body>

</html>
