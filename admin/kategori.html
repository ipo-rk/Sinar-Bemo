<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategori - Admin SINAR BEMO</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
  <link rel="shortcut icon" href="../favicon.ico">
  <meta name="robots" content="noindex, nofollow">

  <script>(function () { const w = console.warn; console.warn = function (...a) { if (typeof a[0] === "string" && a[0].includes("cdn.tailwindcss.com")) return; w.apply(console, a); }; })();</script>
  <script>/* theme-init */!function () { var t = localStorage.getItem('theme') || 'system', d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light') }()</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>window.ASSET_BASE = '../';</script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body>

  <div class="admin-shell" x-data="adminShell('kategori')">
    <div id="admin-sidebar-mount"></div>
    <div class="admin-content">
      <div id="admin-topbar-mount"></div>

      <div class="admin-main" x-data="simpleCrudApp('categories')">
        <div class="flex justify-between items-center mb-5">
          <p class="text-sm" style="color:var(--gray-500);" x-text="items.length + ' kategori terdaftar'"></p>
          <button @click="openAdd()" class="btn btn-primary btn-sm"><i data-lucide="plus"
              style="width:14px;height:14px"></i> Tambah Kategori</button>
        </div>

        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Nama</th>
                <th>Slug</th>
                <th>Deskripsi</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="c in items" :key="c.id">
                <tr>
                  <td class="font-medium" x-text="c.name"></td>
                  <td class="text-meta" x-text="c.slug"></td>
                  <td class="text-meta" x-text="c.description || '-'"></td>
                  <td>
                    <div class="flex items-center gap-1">
                      <button @click="openEdit(c)" class="action-icon-btn" aria-label="Edit"><i data-lucide="pencil"
                          style="width:15px;height:15px"></i></button>
                      <button @click="remove(c)" class="action-icon-btn danger" aria-label="Hapus"><i
                          data-lucide="trash-2" style="width:15px;height:15px"></i></button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div x-show="showModal" x-cloak x-transition
          class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4"
          @keydown.escape.window="showModal=false">
          <div class="modal-panel max-w-md w-full p-6" @click.outside="showModal=false">
            <h3 class="text-h3 mb-4" x-text="editing ? 'Edit Kategori' : 'Tambah Kategori'"></h3>
            <label class="form-label">Nama Kategori</label>
            <input x-model="form.name" @input="autoSlug()" type="text" class="form-control mb-3"
              placeholder="Contoh: Pariwisata">
            <label class="form-label">Slug</label>
            <input x-model="form.slug" type="text" class="form-control mb-3" placeholder="pariwisata">
            <label class="form-label">Deskripsi</label>
            <textarea x-model="form.description" rows="2" class="form-control mb-4"
              placeholder="Keterangan singkat kategori..."></textarea>
            <div class="flex gap-2 justify-end">
              <button @click="showModal=false" class="btn btn-outline">Batal</button>
              <button @click="save()" class="btn btn-primary">Simpan</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      mountAdminShell('kategori', 'Kategori');
      setTimeout(() => window.lucide && lucide.createIcons(), 200);
    });
    document.addEventListener('alpine:initialized', () => window.lucide && lucide.createIcons());
  </script>
</body>

</html>
