<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pages - Admin SINAR BEMO.COM</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="robots" content="noindex, nofollow">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div class="admin-shell" x-data="adminShell('pages')">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-content">
    <div id="admin-topbar-mount"></div>

    <div class="admin-main" x-data="{ pages: [
      { title: 'Tentang Kami', slug: 'tentang', updated: '2026-09-01' },
      { title: 'Kontak', slug: 'kontak', updated: '2026-08-20' },
      { title: 'Privacy Policy', slug: 'privacy', updated: '2026-07-15' },
      { title: 'Disclaimer', slug: 'disclaimer', updated: '2026-07-15' },
      { title: 'Sitemap', slug: 'sitemap', updated: '2026-06-30' },
    ] }">
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Judul Halaman</th><th>Slug</th><th>Terakhir Diperbarui</th><th>Aksi</th></tr></thead>
          <tbody>
            <template x-for="p in pages" :key="p.slug">
              <tr>
                <td class="font-medium" x-text="p.title"></td>
                <td class="text-meta" x-text="'/' + p.slug"></td>
                <td class="text-meta" x-text="p.updated"></td>
                <td>
                  <div class="flex items-center gap-1">
                    <a :href="'../pages/' + p.slug + '.html'" target="_blank" class="action-icon-btn" aria-label="Lihat"><i data-lucide="eye" style="width:15px;height:15px"></i></a>
                    <button class="action-icon-btn" aria-label="Edit"><i data-lucide="pencil" style="width:15px;height:15px"></i></button>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    mountAdminShell('pages', 'Pages');
    setTimeout(() => window.lucide && lucide.createIcons(), 200);
  });
</script>
</body>
</html>
