<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambah Berita - Admin SINAR BEMO</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="robots" content="noindex, nofollow">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div class="admin-shell" x-data="adminShell('tambah-berita')">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-content">
    <div id="admin-topbar-mount"></div>

    <div class="admin-main" x-data="articleFormApp()">
      <!-- WORKFLOW EDITORIAL -->
      <div class="card p-4 mb-6 flex items-center gap-2 overflow-x-auto">
        <div class="workflow-step" :class="form.status === 'draft' ? 'active' : ''"><i data-lucide="file-edit" style="width:14px;height:14px"></i> Draft</div>
        <i data-lucide="arrow-right" style="width:14px;height:14px" class="workflow-arrow"></i>
        <div class="workflow-step" :class="form.status === 'review' ? 'active' : ''"><i data-lucide="send" style="width:14px;height:14px"></i> Submit Review</div>
        <i data-lucide="arrow-right" style="width:14px;height:14px" class="workflow-arrow"></i>
        <div class="workflow-step" :class="form.status === 'revision' ? 'active' : ''"><i data-lucide="rotate-ccw" style="width:14px;height:14px"></i> Revisi</div>
        <i data-lucide="arrow-right" style="width:14px;height:14px" class="workflow-arrow"></i>
        <div class="workflow-step" :class="form.status === 'published' ? 'active' : ''"><i data-lucide="check-circle-2" style="width:14px;height:14px"></i> Published</div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- FORM -->
        <div class="lg:col-span-2 flex flex-col gap-4">
          <div class="card p-5">
            <label class="form-label">Judul Berita</label>
            <input x-model="form.title" @input="autoSlug()" type="text" class="form-control" placeholder="Tulis judul berita...">

            <label class="form-label mt-4">Slug</label>
            <input x-model="form.slug" type="text" class="form-control" placeholder="judul-berita-otomatis">

            <label class="form-label mt-4">Excerpt / Ringkasan</label>
            <textarea x-model="form.excerpt" rows="2" class="form-control" placeholder="Ringkasan singkat berita..."></textarea>

            <label class="form-label mt-4">Isi Berita</label>
            <div class="editor-toolbar">
              <button type="button" @click="exec('bold')" title="Bold"><i data-lucide="bold" style="width:15px;height:15px"></i></button>
              <button type="button" @click="exec('italic')" title="Italic"><i data-lucide="italic" style="width:15px;height:15px"></i></button>
              <button type="button" @click="exec('underline')" title="Underline"><i data-lucide="underline" style="width:15px;height:15px"></i></button>
              <button type="button" @click="exec('insertUnorderedList')" title="Bullet List"><i data-lucide="list" style="width:15px;height:15px"></i></button>
              <button type="button" @click="exec('insertOrderedList')" title="Numbered List"><i data-lucide="list-ordered" style="width:15px;height:15px"></i></button>
              <button type="button" @click="exec('formatBlock', 'blockquote')" title="Quote"><i data-lucide="quote" style="width:15px;height:15px"></i></button>
            </div>
            <div id="editorContent" class="editor-content" contenteditable="true" x-init="$el.innerHTML = form.content" @input="form.content = $event.target.innerHTML" placeholder="Tulis isi berita di sini..."></div>
          </div>
        </div>

        <!-- SIDEBAR FORM -->
        <div class="flex flex-col gap-4">
          <div class="card p-5">
            <h3 class="text-h3 mb-3">Publikasikan</h3>
            <label class="form-label">Status</label>
            <select x-model="form.status" class="form-control mb-3">
              <option value="draft">Draft</option>
              <option value="review">Review</option>
              <option value="published">Published</option>
            </select>
            <label class="form-label">Tanggal Terbit</label>
            <input x-model="form.published_at" type="datetime-local" class="form-control mb-3">
            <label class="flex items-center gap-2 text-sm mb-2"><input type="checkbox" x-model="form.featured"> Featured</label>
            <label class="flex items-center gap-2 text-sm mb-4"><input type="checkbox" x-model="form.breaking"> Breaking News</label>
            <div class="flex flex-col gap-2">
              <button @click="publishNow()" class="btn btn-primary">Terbitkan</button>
              <button @click="submitReview()" class="btn btn-secondary">Kirim untuk Review</button>
              <button @click="saveDraft()" class="btn btn-outline">Simpan sebagai Draft</button>
              <button @click="previewOpen = true" class="btn btn-ghost">Preview</button>
            </div>
          </div>

          <div class="card p-5">
            <h3 class="text-h3 mb-3">Kategori &amp; Tag</h3>
            <label class="form-label">Kategori</label>
            <select x-model="form.category" class="form-control mb-3">
              <option value="">Pilih kategori</option>
              <template x-for="c in categories" :key="c.id"><option :value="c.name" x-text="c.name"></option></template>
            </select>
            <label class="form-label">Tags (pisahkan dengan koma)</label>
            <input x-model="form.tags" type="text" class="form-control" placeholder="pemilu, otsus, infrastruktur">
          </div>

          <div class="card p-5">
            <h3 class="text-h3 mb-3">Media</h3>
            <label class="form-label">URL Thumbnail</label>
            <input x-model="form.thumbnail" type="text" class="form-control mb-3" placeholder="https://...">
            <label class="form-label">Caption Foto</label>
            <input x-model="form.caption" type="text" class="form-control mb-3" placeholder="Keterangan foto">
            <template x-if="form.thumbnail"><img :src="form.thumbnail" class="w-full rounded-md mt-2" style="aspect-ratio:16/9;object-fit:cover;"></template>
          </div>

          <div class="card p-5">
            <h3 class="text-h3 mb-3">Penulis</h3>
            <select x-model="form.author" class="form-control">
              <template x-for="a in authors" :key="a.id"><option :value="a.name" x-text="a.name"></option></template>
            </select>
          </div>
        </div>
      </div>

      <!-- PREVIEW MODAL (scope sama dengan form di atas: articleFormApp()) -->
      <div x-show="previewOpen" x-cloak x-transition class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4" @keydown.escape.window="previewOpen=false">
        <div class="modal-panel max-w-2xl w-full p-6 overflow-y-auto" style="max-height:85vh;" @click.outside="previewOpen=false">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-h3">Preview Berita</h3>
            <button @click="previewOpen=false" class="btn btn-ghost btn-icon"><i data-lucide="x"></i></button>
          </div>
          <span class="badge badge-category" x-text="form.category || 'Kategori'"></span>
          <h1 class="text-h1 mt-3" x-text="form.title || 'Judul berita akan tampil di sini'"></h1>
          <p class="text-sm mt-2" style="color:var(--gray-500);" x-text="form.excerpt"></p>
          <template x-if="form.thumbnail"><img :src="form.thumbnail" class="w-full rounded-md my-4" style="aspect-ratio:16/9;object-fit:cover;"></template>
          <div class="article-body" x-html="form.content || previewPlaceholder"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    mountAdminShell('tambah-berita', 'Tambah Berita');
    setTimeout(() => window.lucide && lucide.createIcons(), 200);
  });
  document.addEventListener('alpine:initialized', () => window.lucide && lucide.createIcons());
</script>
</body>
</html>
