<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komentar - Admin SINAR BEMO</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="robots" content="noindex, nofollow">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div class="admin-shell" x-data="adminShell('komentar')">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-content">
    <div id="admin-topbar-mount"></div>

    <div class="admin-main" x-data="commentModerationApp()">
      <div class="flex gap-1 mb-5">
        <button @click="filter='all'" class="tab-btn" :class="filter==='all' ? 'active' : ''">Semua</button>
        <button @click="filter='pending'" class="tab-btn" :class="filter==='pending' ? 'active' : ''">Pending</button>
        <button @click="filter='approved'" class="tab-btn" :class="filter==='approved' ? 'active' : ''">Approved</button>
        <button @click="filter='rejected'" class="tab-btn" :class="filter==='rejected' ? 'active' : ''">Rejected</button>
        <button @click="filter='spam'" class="tab-btn" :class="filter==='spam' ? 'active' : ''">Spam</button>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>User</th><th>Komentar</th><th>Tanggal</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody>
            <template x-for="c in filtered" :key="c.id">
              <tr>
                <td>
                  <div class="font-medium" x-text="c.name"></div>
                  <div class="text-meta" x-text="c.email"></div>
                </td>
                <td style="max-width:320px;" x-text="c.content"></td>
                <td class="text-meta" x-text="Components.timeAgo(c.date)"></td>
                <td x-html="Components.statusBadge(c.status === 'pending' ? 'review' : (c.status === 'approved' ? 'published' : (c.status === 'spam' ? 'archived' : 'rejected')))"></td>
                <td>
                  <div class="flex items-center gap-1">
                    <button @click="approve(c)" class="action-icon-btn" aria-label="Setujui"><i data-lucide="check" style="width:15px;height:15px"></i></button>
                    <button @click="reject(c)" class="action-icon-btn" aria-label="Tolak"><i data-lucide="x" style="width:15px;height:15px"></i></button>
                    <button @click="markSpam(c)" class="action-icon-btn" aria-label="Spam"><i data-lucide="shield-alert" style="width:15px;height:15px"></i></button>
                    <button @click="remove(c)" class="action-icon-btn danger" aria-label="Hapus"><i data-lucide="trash-2" style="width:15px;height:15px"></i></button>
                  </div>
                </td>
              </tr>
            </template>
            <tr x-show="filtered.length === 0"><td colspan="5"><div x-html="Components.emptyStateHTML('Tidak ada komentar.', 'Belum ada komentar pada status ini.')"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    mountAdminShell('komentar', 'Komentar');
    setTimeout(() => window.lucide && lucide.createIcons(), 200);
  });
  document.addEventListener('alpine:initialized', () => window.lucide && lucide.createIcons());
</script>
</body>
</html>
