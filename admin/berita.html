<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semua Berita - Admin SINAR BEMO</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="robots" content="noindex, nofollow">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div class="admin-shell" x-data="adminShell('berita')">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-content">
    <div id="admin-topbar-mount"></div>

    <div class="admin-main" x-data="articleListApp()" x-init="init()">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div class="flex items-center gap-2 flex-1 min-w-0">
          <input x-model="query" type="text" placeholder="Cari judul berita..." class="form-control" style="max-width:280px;">
          <select x-model="statusFilter" class="form-control" style="max-width:180px;">
            <option value="all">Semua Status</option>
            <option value="published">Published</option>
            <option value="draft">Draft</option>
            <option value="review">Review</option>
            <option value="revision">Revisi</option>
            <option value="rejected">Ditolak</option>
            <option value="archived">Arsip</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <button x-show="selected.length" @click="bulkDelete()" class="btn btn-outline btn-sm" style="border-color:var(--primary);color:var(--primary);">
            <i data-lucide="trash-2" style="width:14px;height:14px"></i> Hapus (<span x-text="selected.length"></span>)
          </button>
          <a href="tambah-berita.html" class="btn btn-primary btn-sm"><i data-lucide="plus" style="width:14px;height:14px"></i> Tambah Berita</a>
        </div>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th style="width:36px;"><input type="checkbox" @change="toggleSelectAll($event)"></th>
              <th>Thumbnail</th>
              <th>Judul</th>
              <th>Kategori</th>
              <th>Penulis</th>
              <th>Status</th>
              <th>Views</th>
              <th>Tanggal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="a in paged" :key="a.id">
              <tr>
                <td><input type="checkbox" :checked="selected.includes(a.id)" @change="toggleSelect(a.id)"></td>
                <td><img :src="a.image" class="rounded-md object-cover" style="width:56px;height:40px;" :alt="a.title"></td>
                <td class="font-medium" style="max-width:280px;" x-text="a.title"></td>
                <td x-text="a.category"></td>
                <td x-text="a.author"></td>
                <td x-html="Components.statusBadge(a.status)"></td>
                <td x-text="Components.formatViews(a.views)"></td>
                <td class="text-meta" x-text="Components.formatDate(a.published_at)"></td>
                <td>
                  <div class="flex items-center gap-1">
                    <a :href="'../pages/detail-berita.html?slug=' + a.slug" target="_blank" class="action-icon-btn" aria-label="Lihat"><i data-lucide="eye" style="width:15px;height:15px"></i></a>
                    <a :href="'edit-berita.html?slug=' + a.slug" class="action-icon-btn" aria-label="Edit"><i data-lucide="pencil" style="width:15px;height:15px"></i></a>
                    <button @click="deleteArticle(a)" class="action-icon-btn danger" aria-label="Hapus"><i data-lucide="trash-2" style="width:15px;height:15px"></i></button>
                  </div>
                </td>
              </tr>
            </template>
            <tr x-show="paged.length === 0"><td colspan="9"><div x-html="Components.emptyStateHTML('Tidak ada berita ditemukan.', 'Ubah filter pencarian Anda.')"></div></td></tr>
          </tbody>
        </table>
      </div>

      <div class="flex justify-center gap-2 mt-6" x-show="totalPages > 1">
        <button @click="currentPage = Math.max(1, currentPage - 1)" class="page-btn"><i data-lucide="chevron-left" style="width:14px;height:14px"></i></button>
        <template x-for="p in totalPages" :key="p">
          <button @click="currentPage = p" class="page-btn" :class="currentPage === p ? 'active' : ''" x-text="p"></button>
        </template>
        <button @click="currentPage = Math.min(totalPages, currentPage + 1)" class="page-btn"><i data-lucide="chevron-right" style="width:14px;height:14px"></i></button>
      </div>
    </div>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    mountAdminShell('berita', 'Semua Berita');
    setTimeout(() => window.lucide && lucide.createIcons(), 200);
  });
  document.addEventListener('alpine:initialized', () => window.lucide && lucide.createIcons());
</script>
</body>
</html>
