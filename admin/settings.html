<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Admin SINAR BEMO.COM</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="robots" content="noindex, nofollow">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div class="admin-shell" x-data="adminShell('settings')">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-content">
    <div id="admin-topbar-mount"></div>

    <div class="admin-main" x-data="settingsApp()">
      <div class="max-w-2xl">
        <div class="card p-6 mb-4">
          <h3 class="text-h3 mb-4">Identitas Situs</h3>
          <label class="form-label">Nama Situs</label>
          <input x-model="form.site_name" type="text" class="form-control mb-3">
          <label class="form-label">Tagline</label>
          <input x-model="form.tagline" type="text" class="form-control mb-3">
          <label class="form-label">Email Redaksi</label>
          <input x-model="form.email" type="email" class="form-control mb-3">
          <label class="form-label">Telepon</label>
          <input x-model="form.phone" type="text" class="form-control">
        </div>

        <div class="card p-6 mb-4">
          <h3 class="text-h3 mb-4">Preferensi Tampilan</h3>
          <label class="form-label">Berita per Halaman</label>
          <input x-model.number="form.articles_per_page" type="number" class="form-control mb-3" min="4" max="24">
          <label class="form-label">Mode Tema Admin</label>
          <div class="flex gap-2">
            <button @click="setTheme('light')" class="btn btn-outline btn-sm">Light</button>
            <button @click="setTheme('dark')" class="btn btn-outline btn-sm">Dark</button>
            <button @click="setTheme('system')" class="btn btn-outline btn-sm">System</button>
          </div>
        </div>

        <button @click="save()" class="btn btn-primary">Simpan Pengaturan</button>
      </div>
    </div>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    mountAdminShell('settings', 'Settings');
    setTimeout(() => window.lucide && lucide.createIcons(), 200);
  });
</script>
</body>
</html>
