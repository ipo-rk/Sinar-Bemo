<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Admin SINAR BEMO</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="robots" content="noindex, nofollow">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div class="admin-shell" x-data="adminShell('dashboard')">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-content">
    <div id="admin-topbar-mount"></div>

    <div class="admin-main" x-data="dashboardApp()" x-init="init()">
      <template x-if="loading">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <template x-for="i in 8"><div class="skeleton" style="height:80px;"></div></template>
        </div>
      </template>

      <template x-if="!loading">
        <div>
          <!-- STAT CARDS -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="stat-card"><span class="stat-icon" style="background:var(--secondary-light);color:var(--secondary);"><i data-lucide="newspaper" style="width:20px;height:20px"></i></span><div><div class="stat-value" x-text="stats.total_articles"></div><div class="stat-label">Total Berita</div></div></div>
            <div class="stat-card"><span class="stat-icon" style="background:#dcfce7;color:#16a34a;"><i data-lucide="check-circle" style="width:20px;height:20px"></i></span><div><div class="stat-value" x-text="stats.published"></div><div class="stat-label">Published</div></div></div>
            <div class="stat-card"><span class="stat-icon" style="background:var(--gray-100);color:var(--gray-500);"><i data-lucide="file-edit" style="width:20px;height:20px"></i></span><div><div class="stat-value" x-text="stats.draft"></div><div class="stat-label">Draft</div></div></div>
            <div class="stat-card"><span class="stat-icon" style="background:#fef3c7;color:#92400e;"><i data-lucide="clock" style="width:20px;height:20px"></i></span><div><div class="stat-value" x-text="stats.review"></div><div class="stat-label">Menunggu Review</div></div></div>
            <div class="stat-card"><span class="stat-icon" style="background:var(--primary-light);color:var(--primary);"><i data-lucide="x-circle" style="width:20px;height:20px"></i></span><div><div class="stat-value" x-text="stats.rejected"></div><div class="stat-label">Ditolak</div></div></div>
            <div class="stat-card"><span class="stat-icon" style="background:#ede9fe;color:#7c3aed;"><i data-lucide="users" style="width:20px;height:20px"></i></span><div><div class="stat-value" x-text="stats.total_users"></div><div class="stat-label">Total Users</div></div></div>
            <div class="stat-card"><span class="stat-icon" style="background:#e0f2fe;color:#0891b2;"><i data-lucide="message-square" style="width:20px;height:20px"></i></span><div><div class="stat-value" x-text="stats.total_comments"></div><div class="stat-label">Total Comments</div></div></div>
            <div class="stat-card"><span class="stat-icon" style="background:#fce7f3;color:#db2777;"><i data-lucide="eye" style="width:20px;height:20px"></i></span><div><div class="stat-value" x-text="Components.formatViews(stats.total_views)"></div><div class="stat-label">Total Views</div></div></div>
          </div>

          <!-- VISITORS -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="stat-card"><span class="stat-icon" style="background:var(--primary-light);color:var(--primary);"><i data-lucide="footprints" style="width:20px;height:20px"></i></span><div><div class="stat-value" x-text="stats.visitors_today.toLocaleString('id-ID')"></div><div class="stat-label">Pengunjung Hari Ini</div></div></div>
            <div class="stat-card"><span class="stat-icon" style="background:var(--secondary-light);color:var(--secondary);"><i data-lucide="calendar-days" style="width:20px;height:20px"></i></span><div><div class="stat-value" x-text="stats.visitors_week.toLocaleString('id-ID')"></div><div class="stat-label">Pengunjung Minggu Ini</div></div></div>
            <div class="stat-card"><span class="stat-icon" style="background:#fef9c3;color:#854d0e;"><i data-lucide="calendar-range" style="width:20px;height:20px"></i></span><div><div class="stat-value" x-text="stats.visitors_month.toLocaleString('id-ID')"></div><div class="stat-label">Pengunjung Bulan Ini</div></div></div>
          </div>

          <!-- CHARTS -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
            <div class="card p-4 lg:col-span-2">
              <h3 class="text-h3 mb-3">Views Harian (7 Hari Terakhir)</h3>
              <div style="height:240px;"><canvas id="chartDaily"></canvas></div>
            </div>
            <div class="card p-4">
              <h3 class="text-h3 mb-3">Statistik Kategori</h3>
              <div style="height:240px;"><canvas id="chartCategory"></canvas></div>
            </div>
          </div>
          <div class="grid grid-cols-1 gap-4 mb-6">
            <div class="card p-4">
              <h3 class="text-h3 mb-3">Views Mingguan (Bulan Ini)</h3>
              <div style="height:220px;"><canvas id="chartWeekly"></canvas></div>
            </div>
          </div>

          <!-- TOP ARTICLES -->
          <div class="card p-4">
            <h3 class="text-h3 mb-3">Berita Terpopuler</h3>
            <div class="admin-table-wrap" style="border:none;">
              <table class="admin-table">
                <thead><tr><th>Judul</th><th>Kategori</th><th>Penulis</th><th>Views</th><th>Status</th></tr></thead>
                <tbody>
                  <template x-for="a in topArticles" :key="a.id">
                    <tr>
                      <td class="font-medium" x-text="a.title" style="max-width:320px;"></td>
                      <td x-text="a.category"></td>
                      <td x-text="a.author"></td>
                      <td x-text="Components.formatViews(a.views)"></td>
                      <td x-html="Components.statusBadge(a.status)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    mountAdminShell('dashboard', 'Dashboard');
    setTimeout(() => window.lucide && lucide.createIcons(), 200);
  });
  document.addEventListener('alpine:initialized', () => window.lucide && lucide.createIcons());
</script>
</body>
</html>
