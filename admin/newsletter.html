<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter - Admin SINAR BEMO</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="robots" content="noindex, nofollow">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div class="admin-shell" x-data="adminShell('newsletter')">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-content">
    <div id="admin-topbar-mount"></div>

    <div class="admin-main" x-data="{ subs: JSON.parse(localStorage.getItem('sb_newsletter') || '[]') }">
      <div class="stat-card mb-5" style="max-width:320px;">
        <span class="stat-icon" style="background:var(--secondary-light);color:var(--secondary);"><i data-lucide="mail" style="width:20px;height:20px"></i></span>
        <div><div class="stat-value" x-text="subs.length"></div><div class="stat-label">Total Subscriber</div></div>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Email</th><th>Status</th></tr></thead>
          <tbody>
            <template x-for="(email, i) in subs" :key="i">
              <tr><td x-text="email"></td><td><span class="badge badge-status-published">Aktif</span></td></tr>
            </template>
            <tr x-show="subs.length === 0"><td colspan="2"><div x-html="Components.emptyStateHTML('Belum ada subscriber.', 'Data akan muncul ketika pengunjung berlangganan newsletter di situs publik.')"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    mountAdminShell('newsletter', 'Newsletter');
    setTimeout(() => window.lucide && lucide.createIcons(), 200);
  });
</script>
</body>
</html>
