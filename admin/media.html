<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Library - Admin SINAR BEMO.COM</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<meta name="robots" content="noindex, nofollow">

<script>(function(){const w=console.warn;console.warn=function(...a){if(typeof a[0]==="string"&&a[0].includes("cdn.tailwindcss.com"))return;w.apply(console,a);};})();</script>
<script>/* theme-init */!function(){var t=localStorage.getItem('theme')||'system',d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}()</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>window.ASSET_BASE = '../';</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div class="admin-shell" x-data="adminShell('media')">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-content">
    <div id="admin-topbar-mount"></div>

    <div class="admin-main" x-data="mediaApp()" x-init="init()">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div class="flex gap-1">
          <button @click="tab='all'" class="tab-btn" :class="tab==='all' ? 'active' : ''">Semua</button>
          <button @click="tab='foto'" class="tab-btn" :class="tab==='foto' ? 'active' : ''">Foto</button>
          <button @click="tab='video'" class="tab-btn" :class="tab==='video' ? 'active' : ''">Video</button>
        </div>
        <button @click="uploadModal = true" class="btn btn-primary btn-sm"><i data-lucide="upload" style="width:14px;height:14px"></i> Upload Media</button>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
        <template x-for="item in items" :key="item.type + '-' + item.id">
          <div class="media-item">
            <img :src="item.thumb" :alt="item.title">
            <template x-if="item.type === 'video'">
              <div class="absolute" style="top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 8px;border-radius:999px;">VIDEO</div>
            </template>
            <div class="media-overlay">
              <button class="action-icon-btn" style="background:#fff;" aria-label="Lihat"><i data-lucide="eye" style="width:15px;height:15px"></i></button>
              <button @click="remove(item)" class="action-icon-btn" style="background:#fff;color:var(--primary);" aria-label="Hapus"><i data-lucide="trash-2" style="width:15px;height:15px"></i></button>
            </div>
          </div>
        </template>
      </div>

      <!-- Upload modal (prototype) -->
      <div x-show="uploadModal" x-cloak x-transition class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4" @keydown.escape.window="uploadModal=false">
        <div class="modal-panel max-w-md w-full p-6" @click.outside="uploadModal=false">
          <h3 class="text-h3 mb-4">Upload Media</h3>
          <div class="state-box" style="padding:32px 16px;border:1.5px dashed var(--gray-300);border-radius:var(--radius-md);">
            <i data-lucide="upload-cloud" style="width:32px;height:32px;color:var(--gray-300);"></i>
            <p class="text-sm mt-2">Tarik &amp; lepas file di sini, atau klik untuk memilih.</p>
            <p class="text-xs mt-1" style="color:var(--gray-400);">Simulasi — file belum benar-benar diunggah ke server.</p>
          </div>
          <div class="flex gap-2 justify-end mt-4">
            <button @click="uploadModal=false" class="btn btn-outline">Batal</button>
            <button @click="simulateUpload()" class="btn btn-primary">Upload</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    mountAdminShell('media', 'Media Library');
    setTimeout(() => window.lucide && lucide.createIcons(), 200);
  });
  document.addEventListener('alpine:initialized', () => window.lucide && lucide.createIcons());
</script>
</body>
</html>
