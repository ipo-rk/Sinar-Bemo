<!DOCTYPE html>
<html lang="id" x-data="themeApp()" x-init="init()">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SINAR BEMO.COM — Berita Akurat & Terkini</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <meta name="description"
    content="Portal berita terpercaya menghadirkan informasi nasional, daerah, Papua, politik, ekonomi, teknologi, olahraga, dan lifestyle secara akurat dan terkini.">
  <link rel="canonical" href="https://sinarbemo.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SINAR BEMO.COM — Berita Akurat & Terkini">
  <meta property="og:description"
    content="Portal berita terpercaya: nasional, daerah, Papua, politik, ekonomi, teknologi, olahraga, dan lifestyle.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1495020689067-958852a7765e?w=1200&q=80">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Tailwind -->
  <script>(function () { const w = console.warn; console.warn = function (...a) { if (typeof a[0] === "string" && a[0].includes("cdn.tailwindcss.com")) return; w.apply(console, a); }; })();</script>
  <script>/* theme-init */!function () { var t = localStorage.getItem('theme') || 'system', d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light') }()</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bootstrap 5 (grid & component fallback) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom -->
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>window.ASSET_BASE = '';</script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <!-- Alpine.js core dimuat PALING AKHIR agar Alpine.data() di app.js sudah terdaftar
     sebelum Alpine mulai memindai DOM (best practice resmi Alpine.js) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body>

  <div id="site-header-mount"></div>
  <div id="site-navbar-mount"></div>
  <div id="breaking-news-mount"></div>
  <script>Components.mountPublicLayout('beranda');</script>


  <!-- ================= MAIN ================= -->
  <main x-data="homeApp()" x-init="init()">
    <div class="container-app py-6">

      <!-- HERO -->
      <template x-if="loading">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div class="lg:col-span-2 skeleton" style="aspect-ratio:16/9;"></div>
          <div class="flex flex-col gap-4">
            <div class="skeleton" style="height:90px;"></div>
            <div class="skeleton" style="height:90px;"></div>
            <div class="skeleton" style="height:90px;"></div>
          </div>
        </div>
      </template>

      <template x-if="!loading">
        <section aria-label="Berita utama" class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <a :href="'pages/detail-berita.html?slug=' + hero.slug"
            class="lg:col-span-2 relative rounded-lg overflow-hidden group" style="min-height:320px;">
            <img :src="hero.image" :alt="hero.title" class="w-full h-full object-cover"
              style="position:absolute;inset:0;" loading="lazy">
            <div
              style="position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.1) 60%);">
            </div>
            <div class="relative z-10 flex flex-col justify-end h-full p-6" style="min-height:320px;">
              <span class="badge badge-featured w-fit mb-3">Berita Utama</span>
              <h1 class="text-hero text-white mb-2" x-text="hero.title"></h1>
              <p class="text-white text-sm opacity-90 hidden md:block line-clamp-2" x-text="hero.excerpt"></p>
              <div class="flex items-center gap-3 text-white text-xs opacity-80 mt-3">
                <span x-text="hero.author"></span><span>&middot;</span><span
                  x-text="Components.timeAgo(hero.published_at)"></span>
              </div>
            </div>
          </a>
          <div class="flex flex-col gap-4">
            <template x-for="a in heroSupport" :key="a.id">
              <a :href="'pages/detail-berita.html?slug=' + a.slug" class="flex gap-3 group">
                <div class="rounded-md overflow-hidden flex-shrink-0" style="width:96px;height:72px;">
                  <img :src="a.image" :alt="a.title" class="w-full h-full object-cover">
                </div>
                <div class="min-w-0">
                  <span class="text-meta" style="color:var(--secondary);font-weight:600;" x-text="a.category"></span>
                  <h4 class="card-title line-clamp-2" style="font-size:14px;" x-text="a.title"></h4>
                </div>
              </a>
            </template>
          </div>
        </section>
      </template>

      <!-- AD -->
      <div class="my-8" x-html="Components.adSlotHTML('ADVERTISEMENT', 'py-6')"></div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mt-2">
        <!-- LEFT: Latest -->
        <div class="lg:col-span-2">
          <div class="section-head">
            <h2 class="text-h2">Berita Terbaru</h2><a href="pages/terbaru.html">Lihat Semua</a>
          </div>
          <template x-if="loading">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <template x-for="i in 4">
                <div x-html="Components.skeletonCardHTML()"></div>
              </template>
            </div>
          </template>
          <template x-if="!loading">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <template x-for="a in latest.slice(0, visibleLatest)" :key="a.id">
                <div x-html="Components.newsCardHTML(a)"></div>
              </template>
            </div>
          </template>
          <div class="text-center mt-6" x-show="!loading && visibleLatest < latest.length">
            <button @click="loadMore()" class="btn btn-outline">Muat Lebih Banyak</button>
          </div>

          <!-- Pilihan Editor -->
          <div class="section-head mt-12">
            <h2 class="text-h2">Pilihan Editor</h2>
          </div>
          <template x-if="!loading">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <template x-for="a in editorChoice" :key="a.id">
                <div class="flex gap-4 card p-3">
                  <a :href="'pages/detail-berita.html?slug=' + a.slug" class="flex-shrink-0 rounded-md overflow-hidden"
                    style="width:128px;height:96px;">
                    <img :src="a.image" :alt="a.title" class="w-full h-full object-cover">
                  </a>
                  <div class="min-w-0 flex flex-col justify-center gap-1">
                    <span class="badge badge-featured w-fit">Pilihan Editor</span>
                    <a :href="'pages/detail-berita.html?slug=' + a.slug">
                      <h3 class="card-title line-clamp-2" x-text="a.title"></h3>
                    </a>
                    <span class="text-meta" x-text="Components.timeAgo(a.published_at)"></span>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- RIGHT: Sidebar -->
        <aside class="flex flex-col gap-8">
          <div>
            <div class="section-head">
              <h2 class="text-h2">Terpopuler</h2>
            </div>
            <template x-if="!loading">
              <div class="card p-4">
                <template x-for="(a, i) in popular" :key="a.id">
                  <div x-html="Components.popularItemHTML(a, i + 1)"></div>
                </template>
              </div>
            </template>
          </div>
          <div x-html="Components.adSlotHTML('ADVERTISEMENT', 'py-16')"></div>
          <div>
            <div class="section-head">
              <h2 class="text-h2">Kategori</h2>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <template x-for="c in categories.slice(0,6)" :key="c.id">
                <div x-html="Components.categoryCardHTML(c)"></div>
              </template>
            </div>
          </div>
        </aside>
      </div>

      <!-- FOTO TERBARU -->
      <div class="mt-14">
        <div class="section-head">
          <h2 class="text-h2">Foto Terbaru</h2><a href="pages/foto.html">Lihat Semua</a>
        </div>
        <template x-if="!loading">
          <div class="photo-carousel">
            <div class="photo-carousel-track">
              <template x-for="(p, i) in [...photos, ...photos]" :key="i">
                <a href="pages/foto.html" class="photo-carousel-item group"
                  :aria-hidden="i >= photos.length ? 'true' : 'false'" :tabindex="i >= photos.length ? -1 : 0">
                  <img :src="p.image" :alt="p.title" class="w-full h-full object-cover" loading="lazy">
                </a>
              </template>
            </div>
          </div>
        </template>
        <template x-if="loading">
          <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
            <template x-for="i in 6">
              <div class="skeleton" style="aspect-ratio:1/1;border-radius:var(--radius-md);"></div>
            </template>
          </div>
        </template>
      </div>

      <!-- VIDEO TERBARU -->
      <div class="mt-14">
        <div class="section-head">
          <h2 class="text-h2">Video Terbaru</h2><a href="pages/video.html">Lihat Semua</a>
        </div>
        <template x-if="!loading">
          <div class="video-carousel">
            <div class="video-carousel-track">
              <template x-for="(v, i) in [...videos, ...videos]" :key="i">
                <a href="pages/video.html" class="video-carousel-item"
                  :aria-hidden="i >= videos.length ? 'true' : 'false'" :tabindex="i >= videos.length ? -1 : 0">
                  <div class="card overflow-hidden group">
                    <div class="relative aspect-video">
                      <img :src="v.thumbnail" :alt="v.title" class="w-full h-full object-cover" loading="lazy">
                      <div class="absolute inset-0 flex items-center justify-center"
                        style="background:rgba(0,0,0,.25);">
                        <div class="rounded-full flex items-center justify-center"
                          style="width:48px;height:48px;background:rgba(255,255,255,.9);">
                          <i data-lucide="play" style="width:20px;height:20px;color:var(--dark);margin-left:2px;"></i>
                        </div>
                      </div>
                    </div>
                    <div class="p-3">
                      <h4 class="card-title line-clamp-2" style="font-size:14px;" x-text="v.title"></h4>
                    </div>
                  </div>
                </a>
              </template>
            </div>
          </div>
        </template>
        <template x-if="loading">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <template x-for="i in 3">
              <div class="skeleton" style="aspect-ratio:16/9;border-radius:var(--radius-md);"></div>
            </template>
          </div>
        </template>
      </div>

      <!-- NEWSLETTER -->
      <div class="newsletter-section mt-14 text-center" x-data="newsletterApp()">
        <h2 class="text-h1 text-white mb-2">Jangan Lewatkan Berita Terkini</h2>
        <p class="opacity-80 max-w-lg mx-auto mb-6">Berlangganan newsletter kami dan dapatkan ringkasan berita pilihan
          langsung ke email Anda setiap pagi.</p>
        <form @submit.prevent="subscribe()" class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto">
          <input x-model="email" type="email" placeholder="Masukkan email Anda" class="newsletter-input flex-1">
          <button type="submit" class="btn btn-primary">Subscribe</button>
        </form>
      </div>

    </div>
  </main>


  <div id="site-footer-mount"></div>
  <script>
    (function () { var m = document.getElementById('site-footer-mount'); if (m) m.outerHTML = Components.footerHTML(); })();
  </script>

  <script>
    document.addEventListener('alpine:initialized', () => window.lucide && lucide.createIcons());
    window.addEventListener('DOMContentLoaded', () => setTimeout(() => window.lucide && lucide.createIcons(), 100));
  </script>
</body>

</html>
